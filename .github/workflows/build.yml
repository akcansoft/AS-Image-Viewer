name: Build and Release

# Tetikleyicileri güncelliyoruz
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # GitHub Actions sayfasından manuel olarak başlatabilmenizi sağlar

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1) Repo'yu çek
      - uses: actions/checkout@v4

      # 2) AutoHotkey + Ahk2Exe indir
      - name: AutoHotkey ve Ahk2Exe İndir
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.26/AutoHotkey_2.0.26.zip" `
            -OutFile "ahk.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a0a/Ahk2Exe1.1.37.02a0.zip" `
            -OutFile "compiler.zip"
          Expand-Archive ahk.zip -DestinationPath ahk
          Expand-Archive compiler.zip -DestinationPath ahk

      # 3) Derleme
      - name: Derleme (x64 ve x32)
        shell: pwsh
        run: |
          $rootDir = Get-Location
          $ahk_file = Join-Path $rootDir "src/AS Pixel Color.ahk"
          $icon_file = Join-Path $rootDir "src/app_icon.ico"
          $distDir = Join-Path $rootDir "dist"
          
          $baseName = [System.IO.Path]::GetFileNameWithoutExtension($ahk_file)
          $exeName = $baseName -replace " ", "-"
          $exeName32 = "$exeName-x32.exe"
          $exeName64 = "$exeName-x64.exe"

          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $compiler = Join-Path $rootDir "ahk\Ahk2Exe.exe"
          $ahk64    = Join-Path $rootDir "ahk\AutoHotkey64.exe"
          $ahk32    = Join-Path $rootDir "ahk\AutoHotkey32.exe"

          if (!(Test-Path $compiler)) { throw "Ahk2Exe bulunamadı" }
          if (!(Test-Path $ahk_file)) { throw "Kaynak AHK dosyası bulunamadı: $ahk_file" }
          if (!(Test-Path $icon_file)) { throw "İkon dosyası bulunamadı: $icon_file" }

          # x64 Derleme
          & $compiler /in $ahk_file /base $ahk64 /icon $icon_file /out (Join-Path $distDir $exeName64)
          if ($LASTEXITCODE -ne 0) { throw "x64 derleme hatası!" }

          # x32 Derleme
          & $compiler /in $ahk_file /base $ahk32 /icon $icon_file /out (Join-Path $distDir $exeName32)
          if ($LASTEXITCODE -ne 0) { throw "x32 derleme hatası!" }

          Write-Host "=== dist klasörü içeriği ==="
          Get-ChildItem $distDir

      # 4) Mevcut Release'i Güncelle / Dosyaları Ekle
      - name: Mevcut Release'e Dosyaları Yükle
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: ${{ github.ref_name }} # Tetiklenen mevcut tag'i hedef alır
          overwrite: true                  # Eğer aynı isimde exe varsa üzerine yazar
          body: "Derleme dosyaları başarıyla güncellendi."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
