name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Manuel tetikleme aktif

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1) Repo'yu çek
      - uses: actions/checkout@v4

      # 2) Sürüm Numarasını src/version.txt dosyasından oku
      - name: Sürüm Bilgisini Oku
        id: get_version
        shell: pwsh
        run: |
          $versionFile = "src/version.txt"
          if (!(Test-Path $versionFile)) { throw "src/version.txt dosyası bulunamadı!" }
          
          # Dosya içeriğini oku ve boşlukları temizle
          $version = (Get-Content $versionFile).Trim()
          if ([string]::IsNullOrEmpty($version)) { throw "src/version.txt içeriği boş!" }
          
          # Eğer sürüm 'v' ile başlamıyorsa başına 'v' ekle (Örn: 1.0.1 -> v1.0.1)
          if (!$version.StartsWith("v")) { $version = "v$version" }
          
          Write-Host "Tespit edilen sürüm: $version"
          # Sürüm numarasını sonraki adımlarda kullanmak üzere kaydet
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      # 3) AutoHotkey + Ahk2Exe indir
      - name: AutoHotkey ve Ahk2Exe İndir
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.26/AutoHotkey_2.0.26.zip" `
            -OutFile "ahk.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a0a/Ahk2Exe1.1.37.02a0.zip" `
            -OutFile "compiler.zip"
          Expand-Archive ahk.zip -DestinationPath ahk
          Expand-Archive compiler.zip -DestinationPath ahk

      # 4) Derleme
      - name: Derleme (x64 ve x32)
        shell: pwsh
        run: |
          $rootDir = Get-Location
          $ahk_file = Join-Path $rootDir "src/AS Image Viewer.ahk"
          $icon_file = Join-Path $rootDir "src/app_icon.ico"
          $distDir = Join-Path $rootDir "dist"
          
          $baseName = [System.IO.Path]::GetFileNameWithoutExtension($ahk_file)
          $exeName = $baseName -replace " ", "-"
          $exeName32 = "$exeName-x32.exe"
          $exeName64 = "$exeName-x64.exe"

          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $compiler = Join-Path $rootDir "ahk\Ahk2Exe.exe"
          $ahk64    = Join-Path $rootDir "ahk\AutoHotkey64.exe"
          $ahk32    = Join-Path $rootDir "ahk\AutoHotkey32.exe"

          if (!(Test-Path $compiler)) { throw "Ahk2Exe bulunamadı" }
          if (!(Test-Path $ahk_file)) { throw "Kaynak AHK dosyası bulunamadı: $ahk_file" }
          if (!(Test-Path $icon_file)) { throw "İkon dosyası bulunamadı: $icon_file" }

          $target64 = Join-Path $distDir $exeName64
          $target32 = Join-Path $distDir $exeName32

          # x64 Derleme
          Write-Host "x64 derleniyor..."
          $p64 = Start-Process -FilePath $compiler -ArgumentList "/in `"$ahk_file`" /base `"$ahk64`" /icon `"$icon_file`" /out `"$target64`"" -Wait -NoNewWindow -PassThru
          Start-Sleep -Milliseconds 500
          if (!(Test-Path $target64)) { throw "x64 derleme başarısız!" }

          # x32 Derleme
          Write-Host "x32 derleniyor..."
          $p32 = Start-Process -FilePath $compiler -ArgumentList "/in `"$ahk_file`" /base `"$ahk32`" /icon `"$icon_file`" /out `"$target32`"" -Wait -NoNewWindow -PassThru
          Start-Sleep -Milliseconds 500
          if (!(Test-Path $target32)) { throw "x32 derleme başarısız!" }

          Write-Host "=== dist klasörü içeriği ==="
          Get-ChildItem $distDir

      # 5) version.txt'den gelen değere göre Release'i oluştur veya güncelle
      - name: Release Güncelle veya Oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          tag_name: ${{ steps.get_version.outputs.VERSION }} # Dosyadan okunan dinamik tag adı
          name: ${{ steps.get_version.outputs.VERSION }}     # Release başlığı (Örn: v1.0.0)
          overwrite_files: true                              # Doğru parametre ismiyle güncellendi
          body: "Derleme dosyaları otomatik olarak güncellendi."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
